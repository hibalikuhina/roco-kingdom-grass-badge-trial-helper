name: release

# Only a version tag builds. GitHub does not attach a branch to a tag push, so
# "tags on main" is enforced by the guard step below rather than by the trigger.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write        # needed to create the release

jobs:
  windows-exe:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse a tag that is not on main
        shell: bash
        run: |
          git fetch --no-tags origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$GITHUB_REF_NAME is on main - continuing"
          else
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Tests
        run: |
          python tests/test_pipeline.py
          python tests/test_grid_split.py

      - name: Build the exe
        run: >
          pyinstaller --onefile --windowed
          --name RocoKingdomTrialHelper --noconfirm main.py

      - name: Check the exe starts
        shell: pwsh
        run: |
          $p = Start-Process .\dist\RocoKingdomTrialHelper.exe -PassThru
          Start-Sleep -Seconds 20
          # a one-file build re-execs itself, so look for any process by name
          $alive = Get-Process -Name RocoKingdomTrialHelper -ErrorAction SilentlyContinue
          if (-not $alive) { throw "the exe exited on startup" }
          $alive | Stop-Process -Force
          "started and still running after 20s"

      - uses: actions/upload-artifact@v4
        with:
          name: RocoKingdomTrialHelper
          path: dist/RocoKingdomTrialHelper.exe

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RocoKingdomTrialHelper.exe
          generate_release_notes: true
